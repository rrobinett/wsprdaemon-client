# pipeline-v2 env vars (added by sigmond).  Kept in a systemd drop-in
# rather than the auto-generated /etc/wsprdaemon/env/wd-ka9q-record@%i.env
# because envgen.py / wd-ctl apply don't know about these flags and
# silently drop them when the env file is regenerated (e.g. after a
# wsprdaemon.conf band-list change).  Drop-in survives that flow.
#
# WD_DECODE_VIA_DB=1   wspr-recorder runs wsprd/jt9 in-process and writes
#                      decoded spots straight to /var/lib/sigmond/sink.db
#                      (wspr.spots); replaces wd-decode@<band> + wd-post@<band>
#                      chain.  Without this the legacy chain runs and sink.db
#                      stays empty, so smd watch wspr shows nothing.
# WD_UPLOAD_NOTIFY=1   spot_sink sends SIGUSR1 to wd-upload-hs after each
#                      cycle's batch lands; uploader pumps immediately instead
#                      of waiting for its 60 s poll tick.
# WD_VERIFY_FLUSH=1    enable the verify-flush helper that closes wsprnet's
#                      retry queue once spots are confirmed accepted.
# WD_MEMPROFILE=1      tracemalloc-on (25-frame traces) for RSS leak debug.
[Service]
Environment=WD_DECODE_VIA_DB=1
Environment=WD_UPLOAD_NOTIFY=1
Environment=WD_VERIFY_FLUSH=1
Environment=WD_MEMPROFILE=1
