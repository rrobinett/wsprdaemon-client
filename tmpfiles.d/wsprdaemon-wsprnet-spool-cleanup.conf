# /etc/tmpfiles.d/wsprdaemon-wsprnet-spool-cleanup.conf
# 24-hour TTL on stale ``_spots.txt`` files in the per-station wsprnet
# upload spool.  After the wd-upload-hs cutover, ``wd-post`` still
# writes here (its behavior is unchanged), but nothing reads from this
# directory — the new ``wd-upload-hs`` shim consumes ``wspr.spots``
# from sigmond's SQLite sink via ``SqliteSource`` instead.  Without
# this cleanup the directory grows ~few KB per WSPR cycle indefinitely.
#
# Path is a glob matching all per-station subdirectories under
# .../wsprnet/ (e.g. AC0G=B1_EM38ww).  Using ``e`` (adjust-existing)
# rather than ``d`` (create) — ``d`` with a glob on systemd 252
# creates a literal ``*`` directory when nothing exists; ``e`` is a
# pure no-op when the path is absent and globs work as expected
# under ``--clean`` to find existing per-station dirs.
#
# systemd-tmpfiles-clean.timer runs daily by default; that's the
# cadence at which files past the Age threshold get removed.
#
# Format: Type Path Mode User Group Age Argument
e /var/spool/wsprdaemon/posting/uploads/wsprnet/* - - - 24h
