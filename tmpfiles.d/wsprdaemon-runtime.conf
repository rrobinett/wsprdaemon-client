# /etc/tmpfiles.d/wsprdaemon-runtime.conf
# Recreate wsprdaemon's tmpfs-resident runtime directories at every boot.
#
# /run/wsprdaemon is the IPC anchor — wd-ka9q-record drops UNIX sockets
# (wspr-rec-<RX>.sock) there and the hs-uploader shim writes its pidfile
# (wd-upload-hs.pid) there.  Without this entry the first cycle after
# every reboot fails with PermissionError because /run is tmpfs and is
# empty until something creates the directory.
#
# /var/spool/wsprdaemon/recording is mounted as its own tmpfs (see
# /etc/systemd/system/var-spool-wsprdaemon.mount), so the parent
# `recording/` subdir also has to be re-materialised on each boot.
# Per-instance subdirs (recording/<id>) are created by an ExecStartPre
# in the templated unit — `%i` is only known at unit-start time.
#
# Format: Type Path                                Mode User       Group Age Argument
d         /run/wsprdaemon                          0775 wsprdaemon radio  -  -
d         /var/spool/wsprdaemon/recording          0775 wsprdaemon radio  -  -
