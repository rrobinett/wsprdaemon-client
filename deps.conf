# deps.conf — external dependency pins for wsprdaemon v4
# Each entry records the commit/version to install on this host.
# wd-ctl apply verifies the installed source matches before starting services.
#
# Format:
#   [section-name]
#   type       = git | pypi
#   url        = clone URL (git) or package name (pypi)
#   commit     = full SHA-1 (git), version string (pypi), or "latest"
#   install_to = absolute path to source clone (git) or "venv" (pypi)
#
# commit = latest  →  always pull/upgrade to the most recent HEAD/version
# commit = <sha>   →  pin to a specific commit (production)

[kiwiclient]
# jks-prv/kiwiclient — kiwirecorder.py for KiwiSDR receivers
type       = git
url        = https://github.com/jks-prv/kiwiclient.git
commit     = 4df15c57731ad089b7ccedaf8dfb10f8dd1a8d7d
# pinned: 4df15c57731ad089b7ccedaf8dfb10f8dd1a8d7d
install_to = /home/wsprdaemon/kiwiclient

[ka9q-python]
# mijahauan/ka9q-python — RadiodControl + MultiStream for KA9Q radio daemon
type       = pypi
url        = ka9q-python
commit     = 3.13.1
# pinned: 3.13.1 (validated against ka9q-radio f78cff9c, see compat.py)
install_to = venv

[callhash]
# mijahauan/callhash — WSJT-X compound-callsign hash resolution
# (Bob Jenkins lookup3, seed 146).  Used by lib/wdlib/ch_writer.py
# to normalise wsprd's <K1ABC/QRP> bracketed compound-call output
# before inserting into wspr.spots.  Pure stdlib, no transitive deps.
type       = git
url        = https://github.com/mijahauan/callhash.git
commit     = latest
install_to = /home/wsprdaemon/callhash

[wspr-recorder]
# mijahauan/wspr-recorder — WSPR RTP recorder used by wd-ka9q-record
# float32 ring buffer; per-period peak-normalized int16 WAVs
# Source clone lives at install_to; installed into venv with:
#   pip install -e /home/wsprdaemon/wspr-recorder
type       = git
url        = https://github.com/mijahauan/wspr-recorder.git
commit     = 9acf607e881d9da38389dbc0ee8b9149b87990b8
# pinned: 9acf607e881d9da38389dbc0ee8b9149b87990b8
install_to = /home/wsprdaemon/wspr-recorder

[hf-timestd]
# mijahauan/hf-timestd — WWV/CHU IQ recording, tone detection, UTC timing
# Peer service to wsprdaemon; manages its own systemd units via deploy.sh.
type       = git
url        = https://github.com/mijahauan/hf-timestd.git
commit     = 4a45ba01e7077cb26e5e649d0ce9a79489f573f6
# pinned: 4a45ba01e7077cb26e5e649d0ce9a79489f573f6
install_to = /home/wsprdaemon/hf-timestd

[ka9q-radio]
# ka9q/ka9q-radio — Phil Karn's radio daemon (radiod binary)
# Built and installed to /usr/local/sbin/radiod.
# Updating this commit requires: make && sudo make install
# Must match ka9q-python's KA9Q_RADIO_COMMIT (compat.py) so wire-
# protocol decoders are validated against the same headers.  Older
# pins silently drop new tags (e.g., LIFETIME — added in 0f8b622).
type       = git
url        = https://github.com/ka9q/ka9q-radio.git
commit     = f78cff9cc8c7fa33ea49aac9176d9263c535a332
# pinned: f78cff9cc8c7fa33ea49aac9176d9263c535a332 (1.0.0-22)
install_to = /home/wsprdaemon/ka9q-radio

[ka9q-web]
# wa2n-code/ka9q-web — radiod web status UI; one instance per local radiod
# Built and installed to /usr/local/sbin/ka9q-web + /usr/local/share/ka9q-web/html/
# Updating this commit requires:
#   cd /home/wsprdaemon/ka9q-web && make && sudo make install
type       = git
url        = https://github.com/wa2n-code/ka9q-web.git
commit     = 88b28ee91f67eefe45f8dfeccd417221490935c9
# pinned: 88b28ee91f67eefe45f8dfeccd417221490935c9
install_to = /home/wsprdaemon/ka9q-web
# onion is a C library build-time dependency of ka9q-web, not a service.
# wd-ctl builds it from source before building ka9q-web.
onion_url      = https://github.com/davidmoreno/onion.git
onion_commit   = de8ea938342b36c28024fd8393ebc27b8442a161
onion_src      = /home/wsprdaemon/onion

# Removed: [ft8_lib] and [ftlib-pskreporter] used to live here as a
# legacy from wsprdaemon v3, when this repo decoded FT8/FT4 itself.
# In v4 those are psk-recorder's responsibility — see its deploy.toml
# `[[deps.git]]` entries.  Nothing in wsprdaemon-client's runtime
# references decode_ft8 or pskreporter-sender (a `grep` confirms),
# so cloning them on every install was just extra noise.
