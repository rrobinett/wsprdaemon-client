# deps.conf — external dependency pins for wsprdaemon v4
# The installer reads this file and ensures each dependency is present
# at the specified commit before starting services.
#
# Format:
#   [section-name]
#   type       = git | pypi
#   url        = clone URL (git) or package name (pypi)
#   commit     = full SHA-1 (git) or version string (pypi)
#   install_to = absolute path (git clone target) or "venv" (pypi)

[kiwiclient]
# jks-prv/kiwiclient — kiwirecorder.py wrapper for KiwiSDR receivers
type       = git
url        = https://github.com/jks-prv/kiwiclient.git
commit     = 3b8aede72adf11809ce33c4365358b42a48b967d
install_to = /opt/wsprdaemon/kiwiclient

[ka9q-python]
# mijahauan/ka9q-python — RadiodControl + ManagedStream for KA9Q radio daemon
type       = pypi
url        = ka9q-python
commit     = 3.5.0
install_to = venv

[ka9q-radio]
# ka9q/ka9q-radio — Phil Karn's radio daemon (radiod binary)
# Source is built and installed to /usr/local/sbin/radiod.
# Updating this commit requires: make && sudo make install
type       = git
url        = https://github.com/ka9q/ka9q-radio.git
commit     = 42273761ba5b96b243317592a6b8964ab99a9794
install_to = /home/wsprdaemon/wsprdaemon/ka9q-radio
