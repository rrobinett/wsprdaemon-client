# deps.conf — external dependency pins for wsprdaemon v4
# Each entry records the exact commit/version that is installed on this host.
# wd-ctl apply verifies the installed source matches before starting services.
#
# Format:
#   [section-name]
#   type       = git | pypi
#   url        = clone URL (git) or package name (pypi)
#   commit     = full SHA-1 (git) or version string (pypi)
#   install_to = absolute path to source clone (git) or "venv" (pypi)

[kiwiclient]
# jks-prv/kiwiclient — kiwirecorder.py for KiwiSDR receivers
type       = git
url        = https://github.com/jks-prv/kiwiclient.git
commit     = 4df15c57731ad089b7ccedaf8dfb10f8dd1a8d7d
install_to = /home/wsprdaemon/kiwiclient

[ka9q-python]
# mijahauan/ka9q-python — RadiodControl + ManagedStream for KA9Q radio daemon
type       = pypi
url        = ka9q-python
commit     = 3.5.0
install_to = venv

[wspr-recorder]
# mijahauan/wspr-recorder — WSPR RTP recorder used by wd-ka9q-record
# Source clone lives at install_to; installed into venv with:
#   pip install -e /home/wsprdaemon/wspr-recorder
type       = git
url        = https://github.com/mijahauan/wspr-recorder.git
commit     = 67ceaccce0430240323cb30b561a333b82c63be4
install_to = /home/wsprdaemon/wspr-recorder

[hf-timestd]
# mijahauan/hf-timestd — WWV/CHU IQ recording, tone detection, UTC timing
# Peer service to wsprdaemon; manages its own systemd units via deploy.sh.
type       = git
url        = https://github.com/mijahauan/hf-timestd.git
commit     = 84babb1ab52feabb3ac66bdcd47fc2f19f26cc2e
install_to = /home/wsprdaemon/hf-timestd-dev

[ka9q-radio]
# ka9q/ka9q-radio — Phil Karn's radio daemon (radiod binary)
# Built and installed to /usr/local/sbin/radiod.
# Updating this commit requires: make && sudo make install
type       = git
url        = https://github.com/ka9q/ka9q-radio.git
commit     = d39fea8edbcb6214a2d5c63776f80134c679b24e
install_to = /home/wsprdaemon/ka9q-radio

[ka9q-web]
# wa2n-code/ka9q-web — radiod web status UI; one instance per local radiod
# Built and installed to /usr/local/sbin/ka9q-web + /usr/local/share/ka9q-web/html/
# Updating this commit requires:
#   cd /home/wsprdaemon/ka9q-web && make && sudo make install
type       = git
url        = https://github.com/wa2n-code/ka9q-web.git
commit     = 88b28ee91f67eefe45f8dfeccd417221490935c9
install_to = /home/wsprdaemon/ka9q-web
# onion is a C library build-time dependency of ka9q-web, not a service.
# wd-ctl builds it from source before building ka9q-web.
onion_url      = https://github.com/davidmoreno/onion.git
onion_commit   = de8ea938342b36c28024fd8393ebc27b8442a161
onion_src      = /home/wsprdaemon/onion

[ft8_lib]
# ka9q/ft8_lib — FT8/FST4W decoder library used by wd-decode
# Built as a shared library; wd-decode links against it.
type       = git
url        = https://github.com/ka9q/ft8_lib.git
commit     = 6069815dcccac8f8446b0d55f5a27d6fb388cb70
install_to = /home/wsprdaemon/ft8_lib

[ftlib-pskreporter]
# pjsg/ftlib-pskreporter — PSKReporter upload library used by wd-post
type       = git
url        = https://github.com/pjsg/ftlib-pskreporter.git
commit     = a24ab06bd46357062011e189bff4bb7545c4ea78
install_to = /home/wsprdaemon/ftlib-pskreporter
